<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kush Patel — Founder of Search1AI</title>
  <meta name="description" content="Kush Patel is the founder of Search1AI, building AI-powered search tools.">
  <link rel="canonical" href="https://kushpatel.ai/">

  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <!-- Preview cards for LinkedIn, X, iMessage, Slack -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kushpatel.ai/">
  <meta property="og:site_name" content="Kush Patel">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Kush Patel — Founder of Search1AI">
  <meta property="og:description" content="Kush Patel is the founder of Search1AI, building AI-powered search tools.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- TODO(image): og:image needs a real 1200x630 PNG at
       /assets/og-image.png. Left out deliberately — a broken image URL
       gets cached as broken by LinkedIn and X, which is worse than
       having none. Add this line back once the file exists:
       <meta property="og:image" content="https://kushpatel.ai/assets/og-image.png"> -->

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161b" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/styles.css">

  <!-- Marks the document as scripted before first paint, so the CSS can
       safely hide the tagline for its entrance animation. Without this
       flag the line would stay invisible for anyone with JS disabled. -->
  <script>document.documentElement.classList.add('js');</script>

  <!-- ============================================================
       STRUCTURED DATA (JSON-LD)
       The page is now visually name-only, so this is the only
       machine-readable description of who you are. Keeping it is
       what stops the site from being a semantically empty page.

       TODO(image): add "image": "https://kushpatel.ai/assets/kush-patel.jpg"
       to the Person block once a headshot exists.
       ============================================================ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://kushpatel.ai/#kush",
        "name": "Kush Patel",
        "url": "https://kushpatel.ai/",
        "email": "patel.kush1@outlook.com",
        "jobTitle": "Founder",
        "worksFor": { "@id": "https://kushpatel.ai/#search1ai" },
        "description": "Founder of Search1AI, building AI-powered search tools.",
        "sameAs": [
          "https://www.linkedin.com/in/kushpateltech",
          "https://github.com/kushhpatel1"
        ]
      },
      {
        "@type": "Organization",
        "@id": "https://kushpatel.ai/#search1ai",
        "name": "Search1AI",
        "url": "https://search1ai.com",
        "email": "kush@search1ai.com",
        "founder": { "@id": "https://kushpatel.ai/#kush" }
      },
      {
        "@type": "WebSite",
        "@id": "https://kushpatel.ai/#website",
        "url": "https://kushpatel.ai/",
        "name": "Kush Patel",
        "inLanguage": "en-US",
        "publisher": { "@id": "https://kushpatel.ai/#kush" }
      },
      {
        "@type": "WebPage",
        "@id": "https://kushpatel.ai/#webpage",
        "url": "https://kushpatel.ai/",
        "name": "Kush Patel — Founder of Search1AI",
        "isPartOf": { "@id": "https://kushpatel.ai/#website" },
        "about": { "@id": "https://kushpatel.ai/#kush" }
      }
    ]
  }
  </script>
</head>

<body>
  <div class="sheet">
    <!-- Crop marks at the corners of the sheet. Decorative only, and
         suppressed below 768px where they would sit on the screen edge. -->
    <span class="tick tick-tl" aria-hidden="true"></span>
    <span class="tick tick-tr" aria-hidden="true"></span>
    <span class="tick tick-bl" aria-hidden="true"></span>
    <span class="tick tick-br" aria-hidden="true"></span>

    <header class="masthead">
      <span class="domain">kushpatel.ai</span>
    </header>

    <main class="hero">
    <!-- The name is real text in the HTML, not injected by JavaScript.
         Crawlers and screen readers get it immediately; the animation
         is a progressive enhancement layered on top. With JS disabled
         the name simply appears, fully styled. -->
    <h1 class="name" aria-label="Kush Patel">Kush Patel</h1>
    <!-- Set in sentence case and uppercased in CSS. Typing literal caps
         makes some screen readers spell words out as acronyms, and it
         would leave the sitewide text shouting in search snippets. -->
    <p class="star">
      <span class="star-label">My north star</span>
      <span class="star-text">Build beautiful things <span class="nb">physical &amp; digital</span> that change the world</span>
    </p>
  </main>

  <footer class="contact">
    <a href="mailto:patel.kush1@outlook.com">patel.kush1@outlook.com</a>

    <!-- rel="me" states that the profile on the other end is the same
         person as this site — the same claim the sameAs array makes to
         crawlers. Keep the two in step. -->
    <a class="icon" href="https://www.linkedin.com/in/kushpateltech"
       rel="me noopener noreferrer" target="_blank"
       aria-label="Kush Patel on LinkedIn">
      <!-- Drawn as strokes rather than the solid brand mark: at this size
           the filled square reads as a dark blob. Square corners rather
           than rounded, to match the zero-radius rule of the layout. -->
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
           stroke="currentColor" stroke-width="1.7"
           stroke-linecap="square" stroke-linejoin="miter"
           aria-hidden="true" focusable="false">
        <rect x="2.7" y="2.7" width="18.6" height="18.6"/>
        <path d="M7.1 10.7v6.7"/>
        <path d="M11.6 17.4v-6.7"/>
        <path d="M11.6 13.8c0-1.75 1.2-2.95 2.85-2.95s2.85 1.2 2.85 2.95v3.6"/>
        <circle cx="7.1" cy="7.15" r="0.35" fill="currentColor" stroke-width="1.1"/>
      </svg>
    </a>
    </footer>
  </div>

  <script>
    (function () {
      var el = document.querySelector('.name');
      var star = document.querySelector('.star');
      var contact = document.querySelector('.contact');
      if (!el) return;

      function revealStar() {
        if (star) star.classList.add('is-in');
      }
      function revealContact() {
        if (contact) contact.classList.add('is-in');
      }

      // Respect the OS "reduce motion" setting — show everything at once.
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.classList.add('is-done');
        revealStar();
        revealContact();
        return;
      }

      var text = el.textContent.trim();

      // Rebuild the name one <span> per character so each can fade in
      // independently. aria-hidden because the <h1> already carries an
      // aria-label — without it, screen readers spell the name out.
      el.textContent = '';
      el.setAttribute('aria-hidden', 'true');

      var frag = document.createDocumentFragment();
      var chars = [];
      for (var i = 0; i < text.length; i++) {
        var span = document.createElement('span');
        span.className = 'char';
        span.textContent = text[i];
        frag.appendChild(span);
        chars.push(span);
      }
      el.appendChild(frag);

      var caret = document.createElement('span');
      caret.className = 'caret';
      caret.setAttribute('aria-hidden', 'true');
      el.insertBefore(caret, chars[0]);

      var STEP = 145;   // ms between letters
      var START = 450;  // ms before the first letter

      // Unrevealed letters still occupy their space (they are only
      // transparent), so the line never reflows. Walking the caret
      // along keeps it at the writing position instead of parked at
      // the end of the full name.
      chars.forEach(function (span, i) {
        setTimeout(function () {
          span.classList.add('is-visible');
          var next = chars[i + 1];
          if (next) {
            el.insertBefore(caret, next);
          } else {
            el.appendChild(caret);
          }
        }, START + i * STEP);
      });

      var typedFor = START + chars.length * STEP;

      // Once the last letter lands, let the caret settle into a slow blink.
      setTimeout(function () {
        el.classList.add('is-done');
      }, typedFor);

      // A beat of silence after the name, then the line arrives,
      // and the email last so the eye reaches it in order.
      setTimeout(revealStar, typedFor + 350);
      setTimeout(revealContact, typedFor + 1000);
    })();
  </script>
</body>
</html>
