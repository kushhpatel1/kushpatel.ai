<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Page not found — Kush Patel</title>

       pages in search results. Vercel serves this file automatically
       for any unmatched path on a static site. -->

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f2eee5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100d" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main class="notice">
    <h1>Page not found</h1>
    <p>That page doesn’t exist. <a href="/">Return home</a>.</p>
  </main>
</body>
</html>
